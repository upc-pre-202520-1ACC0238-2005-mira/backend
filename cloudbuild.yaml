steps:
  # Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/xantina-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/xantina-backend:latest'
      - '.'
    dir: 'backend'

  # Subir la imagen al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/xantina-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/xantina-backend:latest'

  # Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'xantina-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/xantina-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'PORT=8080'
      # Las variables de entorno sensibles se deben configurar manualmente en Cloud Run
      # MONGO_URI y JWT_SECRET se configuran desde la consola o con gcloud

images:
  - 'gcr.io/$PROJECT_ID/xantina-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/xantina-backend:latest'

timeout: '1200s'
